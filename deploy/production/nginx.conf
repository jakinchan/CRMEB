map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $forwarded_https { default ''; https on; }
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;
    server_tokens off;
    client_max_body_size 52m;
    resolver 127.0.0.11 valid=10s;
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ /\. { deny all; }
    location ~* ^/(install|upgrade)(/|$) { return 404; }
    location ~* \.(sql|ini|log|pem|key|p12)$ { return 404; }
    location / { try_files $uri $uri/ /index.php?s=$uri&$args; }
    location = /index.php {
        include fastcgi_params;
        set $backend php:9000;
        fastcgi_pass $backend;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
    }
    location ~ \.php { return 404; }
    location /notice {
        set $notice workerman:40001;
        rewrite ^/notice/?(.*)$ /$1 break;
        proxy_pass http://$notice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /msg {
        set $chat workerman:40002;
        rewrite ^/msg/?(.*)$ /$1 break;
        proxy_pass http://$chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

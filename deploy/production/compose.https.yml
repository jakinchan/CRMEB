services:
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [nginx]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  caddy-data:
  caddy-config:
